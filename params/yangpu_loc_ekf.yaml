frequency: 50
sensor_timeout: 0.2
two_d_mode: true
publish_tf: false
print_diagnostics: true
debug: false
debug_out_file: /tmp/yangpu_loc_ekf_debug.txt

map_frame: map
odom_frame: odom
base_link_frame: base_link
world_frame: map

# Do not configure odom0/odom1 here.
# yangpu_loc_ekf_node subscribes to /localization/ins, /lio_loc_result,
# /localization/status, and /localization/loc_policy_code itself. It consumes
# Loc's final status/policy codes, adjusts covariance, and feeds selected
# odometry directly into RosEkf.
