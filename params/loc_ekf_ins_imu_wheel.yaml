frequency: 100
sensor_timeout: 0.2
two_d_mode: true
publish_tf: false
print_diagnostics: true
debug: false
debug_out_file: /tmp/loc_ekf_ins_imu_wheel_debug.txt

map_frame: map
odom_frame: odom
base_link_frame: base_link
world_frame: map

state_timeout_sec: 1.0
ins_pose_rejection_threshold: 30.0

imu_use_orientation: false
imu_use_angular_velocity: true
imu_use_linear_acceleration: false
imu_extrinsic_roll: 0.0
imu_extrinsic_pitch: 0.0
imu_extrinsic_yaw: -1.57079632679
# Raw IMU acceleration is reported in g. Convert to m/s^2 before fusion.
imu_linear_acceleration_scale: 9.806
imu_primary_yaw_rate_std_deg: 1.0
imu_weak_yaw_rate_std_deg: 180.0
imu_degraded_yaw_rate_std_deg: 30.0
imu_primary_linear_acceleration_std: 20.0
imu_weak_linear_acceleration_std: 20.0
imu_degraded_linear_acceleration_std: 20.0

wheel_min_dt: 0.005
wheel_max_dt: 0.5
wheel_reset_max_delta_xy: 3.0
wheel_reset_max_delta_yaw: 0.78539816339
wheel_max_speed: 3.0
wheel_max_yaw_rate: 1.0

test_drop_ins_enabled: false
test_drop_ins_start_sec: 20.0
test_drop_ins_period_sec: 30.0
test_drop_ins_duration_sec: 5.0

# Do not configure odom0/imu0 here.
# loc_ekf_ins_imu_wheel_node subscribes to INS, wheel odom, IMU, and Loc
# status/policy itself. INS initializes and anchors x/y/yaw; wheel odom is
# converted from increments to twist; IMU is rotated by the configured extrinsic
# and fused according to Loc state and the optional INS-drop test window.
